<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 340" width="640" height="340" xmlns:c2pa="http://c2pa.org/manifest">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0d1117"/>
      <stop offset="0.5" stop-color="#1a1440"/>
      <stop offset="1" stop-color="#2b0f3d"/>
    </linearGradient>
    <linearGradient id="neon" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#00F7FF"/>
      <stop offset="1" stop-color="#FF00E4"/>
    </linearGradient>
    <clipPath id="screen"><rect x="300" y="60" width="270" height="165" rx="6"/></clipPath>
  </defs>
  <style>
    .float{animation:float 4s ease-in-out infinite}
    .f2{animation-delay:-1.3s}.f3{animation-delay:-2.6s}
    @keyframes float{0%,100%{transform:translateY(0);opacity:.35}50%{transform:translateY(-14px);opacity:.9}}
    .blink{transform-box:fill-box;transform-origin:center;animation:blink 4s infinite}
    @keyframes blink{0%,92%,100%{transform:scaleY(1)}96%{transform:scaleY(.1)}}
    .type1{animation:typeA .5s ease-in-out infinite alternate}
    .type2{animation:typeA .5s ease-in-out infinite alternate-reverse}
    @keyframes typeA{from{transform:translateY(0)}to{transform:translateY(7px)}}
    .bob{animation:bob 2.4s ease-in-out infinite}
    @keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-3px)}}
    .scroll{animation:scroll 6s linear infinite}
    @keyframes scroll{from{transform:translateY(0)}to{transform:translateY(-80px)}}
    .steam{stroke-dasharray:6 6;animation:steam 1.6s linear infinite}
    @keyframes steam{to{stroke-dashoffset:-24}}
    .cursor{animation:cur 1s steps(1) infinite}
    @keyframes cur{50%{opacity:0}}
    .glow{animation:glow 3s ease-in-out infinite}
    @keyframes glow{0%,100%{opacity:.5}50%{opacity:1}}
    text{font-family:'Courier New',monospace}
  </style>

  <rect width="640" height="340" rx="18" fill="url(#bg)"/>
  <circle cx="60" cy="40" r="1.6" fill="#fff" class="glow"/><circle cx="130" cy="25" r="1.2" fill="#00F7FF" class="glow"/>
  <circle cx="600" cy="30" r="1.6" fill="#FF00E4" class="glow"/><circle cx="25" cy="150" r="1.2" fill="#fff" class="glow"/>
  <circle cx="620" cy="260" r="1.4" fill="#00F7FF" class="glow"/>

  <!-- floating symbols -->
  <text x="30" y="110" font-size="22" fill="#00F7FF" class="float">&lt;/&gt;</text>
  <text x="95" y="70" font-size="20" fill="#FF00E4" class="float f2">{ }</text>
  <text x="590" y="120" font-size="20" fill="#8A2BE2" class="float f3">;</text>
  <text x="270" y="40" font-size="18" fill="#00F7FF" class="float f2">=&gt;</text>

  <!-- desk -->
  <rect x="0" y="262" width="640" height="78" fill="#120d26"/>
  <rect x="0" y="258" width="640" height="6" fill="url(#neon)"/>

  <!-- monitor -->
  <rect x="290" y="50" width="290" height="185" rx="10" fill="#07070f" stroke="url(#neon)" stroke-width="2"/>
  <rect x="300" y="60" width="270" height="165" rx="6" fill="#0b1020"/>
  <g clip-path="url(#screen)">
    <g class="scroll">
      <text x="312" y="82" font-size="12" fill="#FF79C6">class <tspan fill="#00F7FF">Developer</tspan> {</text>
      <text x="324" y="100" font-size="12" fill="#50FA7B">build(idea) {</text>
      <text x="336" y="118" font-size="12" fill="#F1FA8C">return ship(idea);</text>
      <text x="324" y="136" font-size="12" fill="#50FA7B">}</text>
      <text x="324" y="154" font-size="12" fill="#BD93F9">// Java + Flutter + AI</text>
      <text x="324" y="172" font-size="12" fill="#FF79C6">while(<tspan fill="#00F7FF">alive</tspan>) learn();</text>
      <text x="312" y="190" font-size="12" fill="#FF79C6">}</text>
      <text x="312" y="208" font-size="12" fill="#FF79C6">class <tspan fill="#00F7FF">Developer</tspan> {</text>
      <text x="324" y="226" font-size="12" fill="#50FA7B">build(idea) {</text>
      <text x="336" y="244" font-size="12" fill="#F1FA8C">return ship(idea);</text>
      <text x="324" y="262" font-size="12" fill="#50FA7B">}</text>
      <text x="324" y="280" font-size="12" fill="#BD93F9">// Java + Flutter + AI</text>
      <text x="324" y="298" font-size="12" fill="#FF79C6">while(<tspan fill="#00F7FF">alive</tspan>) learn();</text>
    </g>
  </g>
  <rect x="312" y="205" width="8" height="14" fill="#00F7FF" class="cursor"/>
  <rect x="420" y="235" width="70" height="14" fill="#1a1a2e"/>
  <rect x="400" y="247" width="110" height="10" rx="3" fill="#1a1a2e"/>

  <!-- keyboard -->
  <rect x="190" y="244" width="130" height="14" rx="4" fill="#26264a" stroke="#00F7FF" stroke-width="1"/>

  <!-- coffee -->
  <rect x="540" y="236" width="26" height="22" rx="4" fill="#FF00E4"/>
  <path d="M566 242 q10 2 0 12" stroke="#FF00E4" stroke-width="3" fill="none"/>
  <path d="M547 228 q-5 -8 0 -16 q5 -8 0 -16" stroke="#fff" stroke-width="2" fill="none" opacity=".7" class="steam"/>
  <path d="M557 228 q-5 -8 0 -16 q5 -8 0 -16" stroke="#fff" stroke-width="2" fill="none" opacity=".5" class="steam"/>

  <!-- chair -->
  <rect x="42" y="150" width="30" height="108" rx="12" fill="#1f1b3d"/>

  <!-- character -->
  <g class="bob">
    <!-- body hoodie -->
    <path d="M70 258 L70 190 Q70 150 115 148 Q160 150 160 190 L160 258 Z" fill="#6A5ACD"/>
    <path d="M95 150 Q115 175 135 150" fill="#4b3fa8"/>
    <rect x="105" y="195" width="20" height="3" rx="1.5" fill="#00F7FF" opacity=".8"/>
    <!-- neck + head -->
    <rect x="105" y="128" width="20" height="24" rx="6" fill="#f2c9a0"/>
    <circle cx="115" cy="105" r="34" fill="#f2c9a0"/>
    <!-- hair -->
    <path d="M80 100 Q82 62 118 66 Q150 68 150 100 Q135 82 112 84 Q92 86 80 100Z" fill="#1b1b2f"/>
    <!-- headphones -->
    <path d="M78 104 Q76 58 116 58 Q156 58 152 104" stroke="#00F7FF" stroke-width="6" fill="none"/>
    <rect x="70" y="96" width="14" height="28" rx="6" fill="#FF00E4"/>
    <rect x="146" y="96" width="14" height="28" rx="6" fill="#FF00E4"/>
    <!-- glasses + eyes -->
    <g class="blink">
      <circle cx="132" cy="104" r="9" fill="#fff"/>
      <circle cx="135" cy="104" r="4" fill="#0d1117"/>
    </g>
    <circle cx="132" cy="104" r="12" fill="none" stroke="#00F7FF" stroke-width="2.5"/>
    <path d="M144 104 L152 102" stroke="#00F7FF" stroke-width="2.5"/>
    <!-- smile -->
    <path d="M122 124 Q132 132 142 122" stroke="#8a4b2f" stroke-width="2.5" fill="none" stroke-linecap="round"/>
    <!-- arms typing -->
    <g class="type1">
      <path d="M140 185 Q185 195 205 242" stroke="#6A5ACD" stroke-width="14" fill="none" stroke-linecap="round"/>
      <circle cx="207" cy="243" r="7" fill="#f2c9a0"/>
    </g>
    <g class="type2">
      <path d="M130 190 Q170 205 235 242" stroke="#5a4bbd" stroke-width="14" fill="none" stroke-linecap="round"/>
      <circle cx="237" cy="243" r="7" fill="#f2c9a0"/>
    </g>
  </g>

  <!-- caption -->
  <text x="320" y="300" font-size="15" fill="url(#neon)" font-weight="bold">$ jestin --status "coding &amp; shipping"</text>
<metadata><c2pa:manifest></c2pa:manifest></metadata></svg>
